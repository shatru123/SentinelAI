name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: sentinelai
          POSTGRES_USER: sentinelai
          POSTGRES_PASSWORD: sentinelai
        options: >-
          --health-cmd "pg_isready -U sentinelai -d sentinelai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: sentinelai
          RABBITMQ_DEFAULT_PASS: sentinelai
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SentinelAI.slnx
      - run: dotnet build SentinelAI.slnx --no-restore --configuration Release
      - name: Verify Playwright test artifacts
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_OUTPUT="tests/SentinelAI.UnitTests/bin/Release/net10.0"
          test -s "$PLAYWRIGHT_OUTPUT/Microsoft.Playwright.dll"
          test -s "$PLAYWRIGHT_OUTPUT/playwright.ps1"
          grep -q 'Microsoft.Playwright.*1.56.0\|Version="1.56.0"' Directory.Packages.props
      - name: Install Playwright Chromium for screenshot coverage
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_OUTPUT="tests/SentinelAI.UnitTests/bin/Release/net10.0"
          pwsh -NoProfile -NonInteractive -File "$PLAYWRIGHT_OUTPUT/playwright.ps1" install --with-deps chromium
      - name: Verify Playwright Chromium executable
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_ROOT="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
          test -d "$BROWSER_ROOT"
          executable="$(find "$BROWSER_ROOT" -type f \( -name chrome -o -name chrome-headless-shell \) -perm -111 -print -quit)"
          test -n "$executable"
          test -x "$executable"
          echo "Using Playwright Chromium executable: $executable"
      - run: dotnet test SentinelAI.slnx --no-build --configuration Release --logger trx
        env:
          SENTINELAI_RABBITMQ_TEST: "true"
          RABBITMQ_TEST_HOST: localhost
          RABBITMQ_TEST_PORT: "5672"
          RABBITMQ_TEST_USER: sentinelai
          RABBITMQ_TEST_PASSWORD: sentinelai
          SENTINELAI_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=sentinelai;Username=sentinelai;Password=sentinelai
          SENTINELAI_RUN_BROWSER_TESTS: "true"
      - name: Create an isolated empty database for migration smoke testing
        shell: bash
        run: |
          set -euo pipefail
          postgres_container="$(docker ps --filter 'ancestor=postgres:17-alpine' --format '{{.ID}}' | head -n 1)"
          test -n "$postgres_container"
          docker exec "$postgres_container" psql -U sentinelai -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE sentinelai_migration;"
      - name: Smoke-test Production one-shot migration startup against an empty database
        run: dotnet src/SentinelAI.Api/bin/Release/net10.0/SentinelAI.Api.dll --migrate
        env:
          ASPNETCORE_ENVIRONMENT: Production
          Database__Provider: Postgres
          Database__ApplyMigrations: "false"
          ConnectionStrings__SentinelAI: Host=localhost;Port=5432;Database=sentinelai_migration;Username=sentinelai;Password=sentinelai
      - run: docker compose --env-file .env.example -f deploy/docker/docker-compose.yml config --quiet
      - name: Set up kubectl and Kustomize
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.34.0"
      - name: Install kubeconform
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v0.8.0"
          EXPECTED_SHA256="9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
          ARCHIVE="$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/yannh/kubeconform/releases/download/${VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output "$ARCHIVE"
          echo "${EXPECTED_SHA256}  ${ARCHIVE}" | sha256sum --check -
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" kubeconform
          sudo install -m 0755 "$RUNNER_TEMP/kubeconform" /usr/local/bin/kubeconform
          kubeconform -v
      - name: Render and schema-validate Kubernetes overlays
        run: bash .github/scripts/validate-kubernetes.sh
      - name: Verify deployment script fails closed
        run: bash .github/scripts/test-deploy-script-safety.sh
      - name: Verify worker certificate bootstrap and packaging
        run: bash .github/scripts/test-worker-certificate-lifecycle.sh
      - name: Install Trivy vulnerability scanner
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.76.2"
          EXPECTED_SHA256="bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
          ARCHIVE="$RUNNER_TEMP/trivy-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" \
            --output "$ARCHIVE"
          echo "${EXPECTED_SHA256}  ${ARCHIVE}" | sha256sum --check -
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" trivy
          sudo install -m 0755 "$RUNNER_TEMP/trivy" /usr/local/bin/trivy
          trivy --version
      - name: Install Syft SBOM generator
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.56.0"
          EXPECTED_SHA256="1c2493cfcf52d3367d6cb25780d9190c111c2219c34c820574c43e8bae15c528"
          ARCHIVE="$RUNNER_TEMP/syft-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/anchore/syft/releases/download/v${VERSION}/syft_${VERSION}_linux_amd64.tar.gz" \
            --output "$ARCHIVE"
          echo "${EXPECTED_SHA256}  ${ARCHIVE}" | sha256sum --check -
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" syft
          sudo install -m 0755 "$RUNNER_TEMP/syft" /usr/local/bin/syft
          syft version
      - name: Build API, Web and Worker container images
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --file deploy/docker/Dockerfile.api --tag sentinelai-api:ci .
          docker build --pull --file deploy/docker/Dockerfile.web --tag sentinelai-web:ci .
          docker build --pull --file deploy/docker/Dockerfile.worker --tag sentinelai-worker:ci .
      - name: Generate image SBOMs and run vulnerability scans
        shell: bash
        run: |
          set -u
          mkdir -p artifacts/security
          scan_status=0
          for component in api web worker; do
            image="sentinelai-${component}:ci"
            syft "$image" --output "cyclonedx-json=artifacts/security/${component}.cdx.json"
            if ! trivy image --scanners vuln,secret --ignore-unfixed --severity CRITICAL,HIGH \
              --format sarif --output "artifacts/security/${component}.sarif" --exit-code 1 "$image"; then
              scan_status=1
            fi
          done
          # Scan checked-in source, dependency manifests, and deployment definitions.
          if ! trivy fs --scanners vuln,secret --ignore-unfixed --severity CRITICAL,HIGH \
            --format sarif --output artifacts/security/source.sarif --exit-code 1 .; then
            scan_status=1
          fi
          # Configuration findings are recorded for review. Cluster-specific ingress,
          # secret-store and network policy rules require the selected provider/CNI gate.
          trivy config --severity CRITICAL,HIGH --format sarif \
            --output artifacts/security/configuration.sarif --exit-code 0 deploy
          exit "$scan_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: artifacts/security/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"
