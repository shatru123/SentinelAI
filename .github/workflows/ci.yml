name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: sentinelai
          POSTGRES_USER: sentinelai
          POSTGRES_PASSWORD: sentinelai
        options: >-
          --health-cmd "pg_isready -U sentinelai -d sentinelai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: sentinelai
          RABBITMQ_DEFAULT_PASS: sentinelai
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SentinelAI.slnx
      - run: dotnet build SentinelAI.slnx --no-restore --configuration Release
      - name: Verify Playwright test artifacts
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_OUTPUT="tests/SentinelAI.UnitTests/bin/Release/net10.0"
          test -s "$PLAYWRIGHT_OUTPUT/Microsoft.Playwright.dll"
          test -s "$PLAYWRIGHT_OUTPUT/playwright.ps1"
          grep -q 'Microsoft.Playwright.*1.56.0\|Version="1.56.0"' Directory.Packages.props
      - name: Install Playwright Chromium for screenshot coverage
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_OUTPUT="tests/SentinelAI.UnitTests/bin/Release/net10.0"
          pwsh -NoProfile -NonInteractive -File "$PLAYWRIGHT_OUTPUT/playwright.ps1" install --with-deps chromium
      - name: Verify Playwright Chromium executable
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_ROOT="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
          test -d "$BROWSER_ROOT"
          executable="$(find "$BROWSER_ROOT" -type f \( -name chrome -o -name chrome-headless-shell \) -perm -111 -print -quit)"
          test -n "$executable"
          test -x "$executable"
          echo "Using Playwright Chromium executable: $executable"
      - run: dotnet test SentinelAI.slnx --no-build --configuration Release --logger trx
        env:
          SENTINELAI_RABBITMQ_TEST: "true"
          RABBITMQ_TEST_HOST: localhost
          RABBITMQ_TEST_PORT: "5672"
          RABBITMQ_TEST_USER: sentinelai
          RABBITMQ_TEST_PASSWORD: sentinelai
          SENTINELAI_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=sentinelai;Username=sentinelai;Password=sentinelai
          SENTINELAI_RUN_BROWSER_TESTS: "true"
      - run: docker compose --env-file .env.example -f deploy/docker/docker-compose.yml config --quiet
      - name: Set up kubectl and Kustomize
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.34.0"
      - name: Install kubeconform
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v0.8.0"
          EXPECTED_SHA256="9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
          ARCHIVE="$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/yannh/kubeconform/releases/download/${VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output "$ARCHIVE"
          echo "${EXPECTED_SHA256}  ${ARCHIVE}" | sha256sum --check -
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" kubeconform
          sudo install -m 0755 "$RUNNER_TEMP/kubeconform" /usr/local/bin/kubeconform
          kubeconform -v
      - name: Render and schema-validate Kubernetes overlays
        run: bash .github/scripts/validate-kubernetes.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"
