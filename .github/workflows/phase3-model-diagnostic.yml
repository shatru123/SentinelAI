name: Phase 3 EF Model Diagnostic
on:
  push:
    branches:
      - feat/phase-3-vulnerability-intelligence
permissions:
  contents: read
jobs:
  model-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SentinelAI.slnx
      - run: dotnet build SentinelAI.slnx --no-restore --configuration Release
      - name: Install EF CLI
        shell: bash
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.4
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Generate model diff against committed snapshot
        shell: bash
        run: |
          set -euo pipefail
          dotnet ef migrations add Phase3ModelDiff \
            --project src/SentinelAI.Infrastructure/SentinelAI.Infrastructure.csproj \
            --startup-project src/SentinelAI.Api/SentinelAI.Api.csproj \
            --context AppDbContext \
            --output-dir Migrations/Phase3ModelDiff
          echo "=== GENERATED MIGRATION UP/DOWN ==="
          cat src/SentinelAI.Infrastructure/Migrations/Phase3ModelDiff/*.cs
          echo "=== SNAPSHOT DIFF ==="
          git diff -- src/SentinelAI.Infrastructure/Migrations/AppDbContextModelSnapshot.cs
