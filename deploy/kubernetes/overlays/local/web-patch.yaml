apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelai-web
  namespace: sentinelai
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: web
          env:
            - name: Authentication__ClientSecret
              $patch: delete
            - name: Api__BaseUrl
              value: http://sentinelai-api:8080
            - name: Api__UseDevelopmentHeaders
              value: "true"
          securityContext:
            readOnlyRootFilesystem: false
