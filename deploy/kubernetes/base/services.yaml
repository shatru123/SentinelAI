apiVersion: v1
kind: Service
metadata:
  name: sentinelai-api
  namespace: sentinelai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sentinelai-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelai-api-worker
  namespace: sentinelai
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: sentinelai-api
  ports:
    - name: worker-mtls
      port: 8443
      targetPort: worker-mtls
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelai-web
  namespace: sentinelai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sentinelai-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelai-worker
  namespace: sentinelai
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: sentinelai-worker
  ports:
    - name: metrics
      port: 9464
      targetPort: 9464
