        key: production/sentinelai/pki/worker-client-pfx-password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentinelai-public-ingress-tls
  namespace: sentinelai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sentinelai-production
    kind: ClusterSecretStore
  target:
    name: sentinelai-public-ingress-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: production/sentinelai/ingress/tls-certificate
    - secretKey: tls.key
      remoteRef:
        key: production/sentinelai/ingress/tls-private-key
---
