apiVersion: v1
kind: Service
metadata:
  name: sentinelai-postgres
  namespace: sentinelai
spec:
  selector:
    app.kubernetes.io/name: sentinelai-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentinelai-postgres
  namespace: sentinelai
spec:
  serviceName: sentinelai-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelai-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinelai-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: sentinelai
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sentinelai-local-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentinelai-local-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelai-rabbitmq
  namespace: sentinelai
spec:
  selector:
    app.kubernetes.io/name: sentinelai-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentinelai-rabbitmq
  namespace: sentinelai
spec:
  serviceName: sentinelai-rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelai-rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinelai-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-alpine
          ports:
            - name: amqp
              containerPort: 5672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: sentinelai-local-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: sentinelai-local-secrets
                  key: RABBITMQ_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
