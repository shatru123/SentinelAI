apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinelai-otel-config
  namespace: sentinelai
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 256
      batch:
        timeout: 5s
    exporters:
      otlp/upstream:
        endpoint: ${env:OTEL_UPSTREAM_OTLP_ENDPOINT}
        tls:
          insecure: false
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/upstream]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/upstream]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/upstream]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelai-otel-collector
  namespace: sentinelai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelai-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinelai-otel-collector
    spec:
      serviceAccountName: sentinelai-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.141.0
          args: ["--config=/conf/collector.yaml"]
          env:
            - name: OTEL_UPSTREAM_OTLP_ENDPOINT
              value: otel-upstream.sentinelai-operations.svc.cluster.local:4317
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: sentinelai-otel-config
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelai-otel-collector
  namespace: sentinelai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sentinelai-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
