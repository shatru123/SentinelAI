apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentinelai-api-database
  namespace: sentinelai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sentinelai-production
    kind: ClusterSecretStore
  target:
    name: sentinelai-api-database
    creationPolicy: Owner
  data:
    - secretKey: connection
      remoteRef:
        key: production/sentinelai/api/database-connection
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentinelai-api-broker
  namespace: sentinelai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sentinelai-production
    kind: ClusterSecretStore
  target:
    name: sentinelai-api-broker
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: production/sentinelai/api/rabbitmq-username
    - secretKey: password
      remoteRef:
        key: production/sentinelai/api/rabbitmq-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentinelai-worker-ca
  namespace: sentinelai
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: sentinelai-production
    kind: ClusterSecretStore
  target:
    name: sentinelai-worker-ca
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ca.crt
      remoteRef:
        key: production/sentinelai/pki/worker-client-ca-public
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentinelai-api-mtls
  namespace: sentinelai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sentinelai-production
    kind: ClusterSecretStore
  target:
    name: sentinelai-api-mtls
    creationPolicy: Owner
  data:
    - secretKey: tls.pfx
      remoteRef:
        key: production/sentinelai/pki/api-worker-listener-pfx
    - secretKey: tls-password
      remoteRef:
        key: production/sentinelai/pki/api-worker-listener-pfx-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentinelai-web-oidc
  namespace: sentinelai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sentinelai-production
    kind: ClusterSecretStore
  target:
    name: sentinelai-web-oidc
    creationPolicy: Owner
  data:
