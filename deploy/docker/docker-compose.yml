services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SentinelAI: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Database__Provider: Postgres
      Database__ApplyMigrations: "true"
      Messaging__Mode: RabbitMq
      Messaging__RunOutboxDispatcher: "true"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Authentication__WorkerToken: ${WORKER_CONTROL_PLANE_TOKEN:-local-worker-token-change-me}
      Authentication__WorkerTenantId: ${WORKER_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      Authentication__WorkerCredentials__compose-worker: ${WORKER_CONTROL_PLANE_TOKEN:-local-worker-token-change-me}
      Authentication__WorkerTenants__compose-worker: ${WORKER_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # Local Compose uses an explicit, server-configured development identity for the dashboard.
      # Replace this with OIDC/JWT configuration before any shared deployment.
      AI__DefaultProvider: ${AI_PROVIDER:-ollama}
      AI__OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      AI__Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      AI__Ollama__Endpoint: ${OLLAMA_BASE_URL:-http://ollama:11434}
    ports: ["127.0.0.1:5080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      control:
        aliases: [api]
    deploy:
      resources: { limits: { cpus: "1.0", memory: 512M } }

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Api__BaseUrl: http://api:8080
      Api__UseDevelopmentHeaders: "true"
      Dashboard__TenantId: ${WORKER_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      Dashboard__UserId: 00000000-0000-0000-0000-000000000002
      Dashboard__UserName: compose-operator
      Dashboard__Role: SecurityAnalyst
      Web__EnableHttpsRedirection: "false"
    ports: ["127.0.0.1:5081:8080"]
    depends_on: { api: { condition: service_healthy } }
    networks:
      control:
        aliases: [web]

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    environment:
      DOTNET_ENVIRONMENT: Production
      Database__Provider: Postgres
      ConnectionStrings__SentinelAI: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Messaging__Mode: RabbitMq
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Worker__ControlPlaneUrl: http://api:8080
      Worker__ControlPlaneToken: ${WORKER_CONTROL_PLANE_TOKEN:-local-worker-token-change-me}
      Worker__TenantId: ${WORKER_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      Worker__Identity: compose-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      api: { condition: service_started }
    networks:
      control:
        aliases: [worker]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [sentinelai-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      control:
        aliases: [postgres]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: [sentinelai-rabbitmq:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      control:
        aliases: [rabbitmq]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.141.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: [../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro]
    depends_on: [tempo]
    networks: [control]

  prometheus:
    image: prom/prometheus:v3.7.3
    volumes:
      - ../observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - sentinelai-prometheus:/prometheus
    networks: [control]

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - sentinelai-tempo:/var/tempo
    networks: [control]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [otel-collector, prometheus, tempo]
    volumes:
      - sentinelai-grafana:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [control]

volumes:
  sentinelai-postgres:
  sentinelai-rabbitmq:
  sentinelai-grafana:
  sentinelai-prometheus:
  sentinelai-tempo:

networks:
  control:
    driver: bridge
