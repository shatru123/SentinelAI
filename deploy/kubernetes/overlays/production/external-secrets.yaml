apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentinelai-worker-client-cert
  namespace: sentinelai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sentinelai-production
    kind: ClusterSecretStore
  target:
    name: sentinelai-worker-client
    creationPolicy: Owner
  data:
    - secretKey: current.pfx
      remoteRef:
        key: production/sentinelai/pki/worker-client-current-pfx
    - secretKey: previous.pfx
      remoteRef:
        key: production/sentinelai/pki/worker-client-previous-pfx
    - secretKey: password
